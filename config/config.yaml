#  Another file: AERONET_CONFIG=/path/to/other.yaml python -m src.terminal

conversation_dir: conversation_data     
data_file: /Users/sneupane/Desktop/ai_for_aeronet/DATA/PROCESSED/AERONET_AOD_L2_Daily_V3.parquet  
db_file: agent_turns.sqlite             

keep_turns: 5                           # finished turns the model sees in full; older ones are one index line each (fetch_turn gives the rest)
conv_cost_limit: null                   # USD for a whole conversation; null = no limit
max_images_per_call: 4                  # PNGs attached to one run_python result; the rest are named only
max_site_rows: 50                       # list_sites never returns more rows than this


## THIS IS FOR NASA ENDPOINT
model:
  provider: openai-responses      
  region: us-west-2     # nasa ignores this but backend still expects so a filler here pretty much
  base_url: https://proxy.fast.luna.nasa.gov
  api_key: ${OPENAI_API_KEY}            # export OPENAI_API_KEY=ABC in terminal to sync API key with NASA
  model_id: gpt-5.6-luna
  reasoning_effort: high                
  max_tokens: 32000
  prompt_cache_key: aeronet:v1          
prices: {input: 1.10, cache_read: 0.11, cache_write: 1.10, output: 6.60}

# model:
#   provider: openai-responses # bedrock-mantle              # bedrock-mantle (GPT-5.6 Luna, Responses API, bearer token from the instance role)
#                                         # | openai-compatible (LM Studio, Ollama, vLLM ...: chat completions at base_url, api_key below)
#   region: us-west-2
#   base_url: https://bedrock-runtime.{region}.amazonaws.com/openai/v1   # LM Studio: http://localhost:1234/v1
#   api_key: ${BEDROCK_API_KEY}                     # openai-compatible only; LM Studio accepts anything
#   model_id: us.openai.gpt-6-luna      # LM Studio: the model name shown in its server tab, e.g. qwen2.5-7b-instruct
#   reasoning_effort: high                # none | low | medium | high | xhigh | max (bedrock-mantle only)
#   max_tokens: 32000                     # output tokens of ONE model call (one step), not of the whole question
#   prompt_cache_key: aeronet:v1          # bedrock-mantle only
#   update_prices: true                   # download the latest genai-prices table at startup and every hour;
#                                         # false = the table installed with the package (frozen, reproducible)
#   prices:                               # USD per million tokens. null = Pydantic AI's built-in rate for this model at this
#                                         # endpoint. A value replaces that rate everywhere: step cost, stored cost, cost limits.
#                                         # Built-in Luna rates double above 272k tokens in one call; a value here is flat.
#     input: null                         # uncached input            (Luna on Bedrock built-in: 0.22)
#     cache_read: null                    # input read from the cache (0.022)
#     cache_write: null                   # input written to the cache (0.275)
#     output: null                        # output, reasoning included (1.32)

limits:                                 # per nquestion (Pydantic AI UsageLimits); the loop stops when one is hit
  request_limit: 50                     # model calls per question (loop depth)
  tool_calls_limit: 80                  # successful tool executions per question
  total_tokens_limit: null              # in + out, cumulative over the question; a bad usage metric as it counts cheap cached inputs the same as other tokens (includes all tokens)
  cost_limit: 1                        # USD per question

tool_timeout: 120                       # seconds; a slower tool = failure + retry prompt to the model
retries: 2                              # malformed final_result / failed validator: how often the model may try again

sandbox:                                # docker run limits (sandbox/sandbox.py start())
  memory: 6g
  cpus: 2
  workspace_gb: 1
  idle_minutes: 60                      # the container stops itself after this long without a call

max_running_containers: 2               # sandboxes up at the same time, counted across every terminal of this project

terminal:
  verbose:                              # what the terminal prints; true/false each. /verbose <name> toggles one for the session
    steps: true                         # one line per step: the sentence the model writes before its tool calls
    step_tokens: true                   # under each step: input (uncached, cache read, cache write), output (reasoning), cost of that call
    tool_calls: false                   # every tool call with its arguments and every tool result, as the notebook prints them
    summary: true                       # under the answer: the model's one-line summary (its line in the index of earlier turns)
    kept_variables: true                # under the answer: the variables the model kept in the kernel, with their meaning
    files: true                         # under the answer: the files the turn wrote, as paths on this machine
    turn_tokens: true                   # under the answer: model calls, tool calls, tokens and cost of the whole turn
    conversation_cost: true             # after the answer: what the conversation has cost so far
